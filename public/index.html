<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CodeShop</h1>
        <div class="user-controls">
            <span id="user-display">Not logged in</span>
            <button id="cart-btn">Cart (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main>
        <section id="products-container" class="product-grid">
            </section>
    </main>

    <div id="cart-modal" class="hidden">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total: $<span id="cart-total">0.00</span></p>
        <button id="checkout-btn">Checkout</button>
        <button id="close-cart">Close</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
